services:
  postgres:
    image: postgres:16-alpine
    container_name: addisgebeya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-addisgebeya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-addisgebeya_dev}
      POSTGRES_DB: ${POSTGRES_DB:-addisgebeya_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - addisgebeya_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-addisgebeya} -d ${POSTGRES_DB:-addisgebeya_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  addisgebeya_postgres_data:
    driver: local
